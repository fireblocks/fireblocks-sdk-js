name: Publish to NPM
on:
  release:
    types: [ published ]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SDK_GENERATION_APP_ID }}
          private-key: ${{ secrets.SDK_GENERATION_APP_PRIVATE_KEY }}

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm i -g auto-changelog

      - name: Bump version and add changelog
        run: |
          initialTag=${{ github.event.release.tag_name }}
          tag="${initialTag//[v]/}"
          echo $tag
          git remote update
          git fetch
          git checkout --track origin/master
          git config --global user.email "github-actions@github.com"
          git config --global user.name "Github Actions"
          npm --no-git-tag-version --allow-same-version version $tag
          auto-changelog --hide-credit -l 0 -b 3
          git add .
          git commit -m "release $tag"
          git push

  publish:
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC/Trusted Publishing
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.5.1+
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm install

      - name: Publish package
        run: npm publish
        # No NODE_AUTH_TOKEN needed - OIDC handles authentication

      # npm deprecate only marks versions that already exist, so the version just published
      # installs without a warning until someone re-runs it. OIDC covers publish only, and
      # this repo deliberately holds no npm token, so a maintainer runs it by hand.
      - name: Remind to mark the new version deprecated
        env:
          MESSAGE: "fireblocks-sdk is deprecated and reaches end-of-life (no further updates or fixes) on Nov 1, 2026. Existing installs continue to work. Migrate to @fireblocks/ts-sdk — https://developers.fireblocks.com/reference/sdk-migration-guide"
        run: |
          echo "::warning title=Mark this release deprecated::This version installs without a deprecation warning until a fireblocks-sdk maintainer on npm runs the command in this run's summary."
          {
            echo "## Mark this release deprecated on npm"
            echo
            echo "Run this from an npm account that maintains \`fireblocks-sdk\`. It marks every version, including the one just published:"
            echo
            echo '```'
            printf 'npm deprecate fireblocks-sdk "%s"\n' "$MESSAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"