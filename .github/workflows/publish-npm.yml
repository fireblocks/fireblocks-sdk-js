name: Publish to NPM
on:
  release:
    types: [ published ]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SDK_GENERATION_APP_ID }}
          private-key: ${{ secrets.SDK_GENERATION_APP_PRIVATE_KEY }}

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm i -g auto-changelog

      - name: Bump version and add changelog
        run: |
          initialTag=${{ github.event.release.tag_name }}
          tag="${initialTag//[v]/}"
          echo $tag
          git remote update
          git fetch
          git checkout --track origin/master
          git config --global user.email "github-actions@github.com"
          git config --global user.name "Github Actions"
          npm --no-git-tag-version --allow-same-version version $tag
          auto-changelog --hide-credit -l 0 -b 3
          git add .
          git commit -m "release $tag"
          git push

  publish:
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC/Trusted Publishing
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.5.1+
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm install

      - name: Publish package
        run: npm publish
        # No NODE_AUTH_TOKEN needed - OIDC handles authentication

      # npm deprecate only marks versions that already exist, so every release must
      # re-mark the package or the version just published installs without a warning.
      # OIDC covers publish only, so this step needs its own token.
      - name: Mark every version deprecated
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DEPRECATE_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MESSAGE: "fireblocks-sdk is deprecated and reaches end-of-life (no further updates or fixes) on Nov 1, 2026. Existing installs continue to work. Migrate to @fireblocks/ts-sdk — https://developers.fireblocks.com/reference/sdk-migration-guide"
        run: |
          version="${RELEASE_TAG//[v]/}"
          # The registry can lag a moment behind a fresh publish; retry until the new version carries the mark.
          for attempt in 1 2 3 4 5; do
            npm deprecate fireblocks-sdk "$MESSAGE"
            if [ -n "$(npm view "fireblocks-sdk@$version" deprecated)" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "fireblocks-sdk@$version is still not marked deprecated" >&2
          exit 1